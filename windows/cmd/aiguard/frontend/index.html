<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 出差管家</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/vendor/echarts.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-shield-x" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9.5 9.5l5 5m0-5l-5 5"/></symbol>
    <symbol id="i-shield-off" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M8 12h8"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1116 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.2"/></symbol>
    <symbol id="i-nodes" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l2.8 8m5.2-8l-2.8 8M8.5 6h7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
    <symbol id="i-sub" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/><path d="M17 14v6m-3-3h6"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 0V7a3 3 0 00-3-3z"/><path d="M15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 0"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.6-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0014.6 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 014 4.5l-.6 3.6a2.4 2.4 0 01-4.2 1.1L14.5 15h-5l-1.7 2.2a2.4 2.4 0 01-4.2-1.1L3 12.5A4 4 0 017 8z"/><path d="M8 10.5v3m-1.5-1.5h3"/><circle cx="15.5" cy="11" r=".6"/><circle cx="17" cy="13" r=".6"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a13 13 0 0118 0M6 12.5a8.5 8.5 0 0112 0M9 16a4 4 0 016 0"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3l9-16z"/><path d="M12 10v4m0 3v.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-9.5v.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4-4l4 4 4-4"/><path d="M5 20h14"/></symbol>
  </svg>

  <div class="app" id="app">
    <nav class="nav" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-shield"/></svg></div>
        <div class="brand-text">
          <div class="brand-name">AI 出差管家</div>
          <div class="brand-sub" id="brand-version"></div>
        </div>
      </div>
      <button data-page="overview" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-gauge"/></svg><span class="label">总览</span></button>
      <button data-page="nodes"><svg class="icon" aria-hidden="true"><use href="#i-nodes"/></svg><span class="label">节点</span></button>
      <button data-page="connections"><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg><span class="label">连接</span></button>
      <button data-page="subscription"><svg class="icon" aria-hidden="true"><use href="#i-sub"/></svg><span class="label">订阅</span></button>
      <button data-page="rules"><svg class="icon" aria-hidden="true"><use href="#i-brain"/></svg><span class="label">AI 名单</span></button>
      <button data-page="security"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span class="label">熔断与安全</span></button>
      <button data-page="events"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span class="label">事件</span><span class="badge" id="events-badge" hidden></span></button>
      <div class="spacer"></div>
    </nav>
    <main class="main" id="main" tabindex="-1">
      <section class="page" id="page-overview" aria-labelledby="h-overview"></section>
      <section class="page" id="page-nodes" aria-labelledby="h-nodes" hidden></section>
      <section class="page" id="page-connections" aria-labelledby="h-connections" hidden></section>
      <section class="page" id="page-subscription" aria-labelledby="h-subscription" hidden></section>
      <section class="page" id="page-rules" aria-labelledby="h-rules" hidden></section>
      <section class="page" id="page-security" aria-labelledby="h-security" hidden></section>
      <section class="page" id="page-events" aria-labelledby="h-events" hidden></section>
    </main>
  </div>

  <div id="setup" hidden></div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <div class="dialog-body">
        <h3 id="dialog-title"></h3>
        <p id="dialog-text"></p>
      </div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
